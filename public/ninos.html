
<!DOCTYPE html>
<html lang="es">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/estilos.css">
    <title>Registro de niños | SistemaGuarderia</title>
</head>

<body>
    <div id="menuPrincipal"></div>
    <script src="/menu.js" defer></script>
    <main>
        <h1>Registro de niños</h1>
        <p class="descripcion">
            Sistema de administración de la guardería.
        </p>

        <section class="tarjeta">
            <h2>Registrar nuevo niño</h2>

            <form id="formularioNino" class="formulario">
                <div class="campo completo">
                    <label for="nombre_completo">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre_completo"
                        name="nombre_completo"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input
                        type="date"
                        id="fecha_nacimiento"
                        name="fecha_nacimiento"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="fecha_ingreso">Fecha de ingreso</label>
                    <input
                        type="date"
                        id="fecha_ingreso"
                        name="fecha_ingreso"
                        required
                    >
                </div>

                <div class="campo completo">
                    <button type="submit">Registrar niño</button>
                </div>
            </form>

            <p id="mensaje" class="mensaje" role="status"></p>
        </section>

        <section class="tarjeta">
            <h2>Niños registrados</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Fecha de nacimiento</th>
                            <th>Fecha de ingreso</th>
                            <th>Grupo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="listaNinos">
                        <tr>
                            <td colspan="5">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const formulario = document.getElementById('formularioNino');
        const mensaje = document.getElementById('mensaje');
        const listaNinos = document.getElementById('listaNinos');

        const campoNacimiento = document.getElementById('fecha_nacimiento');
        const campoIngreso = document.getElementById('fecha_ingreso');

        const hoy = new Date();
        const fechaHoy = [
            hoy.getFullYear(),
            String(hoy.getMonth() + 1).padStart(2, '0'),
            String(hoy.getDate()).padStart(2, '0')
        ].join('-');

        campoNacimiento.max = fechaHoy;
        campoIngreso.max = fechaHoy;
        campoIngreso.value = fechaHoy;

        function agregarCelda(fila, texto) {
            const celda = document.createElement('td');
            celda.textContent = texto ?? '';
            fila.appendChild(celda);
        }

        async function cargarNinos() {
            try {
                const respuesta = await fetch('/api/ninos');

                if (!respuesta.ok) {
                    throw new Error('No se pudieron consultar los niños.');
                }

                const ninos = await respuesta.json();
                listaNinos.replaceChildren();

                if (ninos.length === 0) {
                    const fila = listaNinos.insertRow();
                    const celda = fila.insertCell();
                    celda.colSpan = 5;
                    celda.textContent = 'No hay niños registrados.';
                    return;
                }

                ninos.forEach(nino => {
                    const fila = listaNinos.insertRow();

                    agregarCelda(fila, nino.nombre_completo);
                    agregarCelda(fila, nino.fecha_nacimiento);
                    agregarCelda(fila, nino.fecha_ingreso);
                    agregarCelda(fila, nino.nombre_grupo);
                    agregarCelda(fila, nino.estado);
                });
            } catch (error) {
                listaNinos.replaceChildren();
                const fila = listaNinos.insertRow();
                const celda = fila.insertCell();
                celda.colSpan = 5;
                celda.textContent = error.message;
            }
        }

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            mensaje.textContent = '';
            mensaje.className = 'mensaje';

            const datos = {
                nombre_completo:
                    document.getElementById('nombre_completo').value.trim(),
                fecha_nacimiento: campoNacimiento.value,
                fecha_ingreso: campoIngreso.value
            };

            if (datos.fecha_ingreso < datos.fecha_nacimiento) {
                mensaje.textContent =
                    'La fecha de ingreso no puede ser anterior al nacimiento.';
                mensaje.classList.add('error');
                return;
            }

            try {
                const respuesta = await fetch('/api/ninos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        resultado.error || 'No fue posible registrar al niño.'
                    );
                }

                mensaje.textContent =
                    `${resultado.mensaje}\n` +
                    `Edad: ${resultado.edad_meses} meses.\n` +
                    `Grupo asignado: ${resultado.grupo}.`;

                mensaje.classList.add('exito');

                formulario.reset();
                campoIngreso.value = fechaHoy;

                await cargarNinos();
            } catch (error) {
                mensaje.textContent = error.message;
                mensaje.classList.add('error');
            }
        });

        cargarNinos();
    </script>
</body>
</html>
