<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Crear usuario</h1>

        <form id="registroForm">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre"
                required
            >

            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Registrar
            </button>

        </form>

        <p id="mensaje"></p>

        <a href="index.html">
            Volver al login
        </a>

    </div>

    <script src="js/registro.js"></script>

</body>
</html>
